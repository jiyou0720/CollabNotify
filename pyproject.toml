[project]
name = "collabnotify"
version = "0.1.0"
description = "Jira, Confluence, and GitHub notifications for Discord"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
py_version = 312

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
